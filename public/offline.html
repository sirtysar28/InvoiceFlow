<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline · InvoiceFlow</title>
    <link rel="icon" type="image/png" href="/img/icon-192.png">
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, #0f0c29 0%, #1e1b4b 45%, #312e81 75%, #4c1d95 100%);
            color: #fff; text-align: center; padding: 24px;
        }
        .card {
            background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
            border-radius: 24px; padding: 48px 32px; max-width: 420px; backdrop-filter: blur(14px);
        }
        .icon { font-size: 3.4rem; margin-bottom: 12px; }
        h1 { font-size: 1.4rem; margin: 0 0 10px; }
        p { color: rgba(255,255,255,.72); font-size: .95rem; line-height: 1.65; margin: 0 0 24px; }
        a.btn {
            display: inline-block; background: linear-gradient(135deg,#6366f1,#8b5cf6,#d946ef);
            color: #fff; font-weight: 700; text-decoration: none;
            padding: 13px 30px; border-radius: 14px; font-size: .95rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Koneksi Terputus</h1>
        <p>Sepertinya internet Anda sedang tidak tersedia.<br>Halaman yang pernah dibuka tetap bisa diakses dari cache aplikasi.</p>
        <a class="btn" href="/">Coba Lagi</a>
    </div>
</body>
</html>
